# /etc/nginx/conf.d/vpn-proxy.conf
#
# HTTPS relay example. Replace relay.example.com and bot.example.com with your
# real domains on the deployment host. Keep real IPs/domains out of git.

# Correct WebSocket upgrade handling for proxied helper services.
map $http_upgrade $connection_upgrade {
    default   upgrade;
    ""        close;
}

# Safe log format: $safe_uri is defined in nginx.conf and masks path tokens.
log_format proxy_safe '$remote_addr - [$time_local] '
                      '"$request_method $safe_uri $server_protocol" '
                      '$status $body_bytes_sent '
                      'rt=$request_time urt="$upstream_response_time" '
                      'ssl="$ssl_protocol/$ssl_cipher"';

# Catch-all for unknown hostnames and direct IP scans.
server {
    listen 443 ssl default_server;

    ssl_certificate     /etc/letsencrypt/live/relay.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relay.example.com/privkey.pem;
    server_name         _;

    access_log          off;
    return 444;
}

# Main relay server.
server {
    listen 443 ssl;
    server_name relay.example.com;

    ssl_certificate     /etc/letsencrypt/live/relay.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relay.example.com/privkey.pem;
    # ssl_protocols, ssl_ciphers, ssl_session_* are inherited from nginx.conf.

    access_log /var/log/nginx/vpn-proxy-access.log proxy_safe;
    error_log  /var/log/nginx/vpn-proxy-error.log warn;

    client_max_body_size 1k;
    limit_conn addr 10;

    proxy_connect_timeout   10s;
    proxy_send_timeout      30s;
    proxy_read_timeout      60s;

    proxy_intercept_errors on;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        internal;
        default_type text/plain;
        return 503 "Service unavailable\n";
    }

    # =========================================================================
    # Subscription Relay:
    #   client -> nginx:443/<prefix>/<token> -> sub_proxy.py:9080 -> 3x-ui
    # =========================================================================

    location /xui-sub/ {
        limit_except GET HEAD { deny all; }
        include conf.d/sub-proxy-common.inc;
    }

    location /xui-sub-de/ {
        limit_except GET HEAD { deny all; }
        include conf.d/sub-proxy-common.inc;
    }

    location /xui-sub-fr/ {
        limit_except GET HEAD { deny all; }
        include conf.d/sub-proxy-common.inc;
    }

    location @sub_err_not_found {
        internal;
        default_type text/plain;
        return 404 "Not Found\n";
    }

    location @sub_err_bad_gw {
        internal;
        default_type text/plain;
        return 502 "Bad Gateway\n";
    }

    # =========================================================================
    # Optional helper relay for a download/preview service.
    # Remove these locations if this project only serves subscriptions.
    # =========================================================================

    location /info/ {
        limit_except GET HEAD { deny all; }

        limit_req zone=one burst=10 nodelay;

        proxy_pass                        https://bot.example.com:7443;
        proxy_http_version                1.1;

        proxy_ssl_protocols               TLSv1.2 TLSv1.3;
        proxy_ssl_server_name             on;
        proxy_ssl_name                    bot.example.com;
        proxy_ssl_verify                  on;
        proxy_ssl_trusted_certificate     /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_session_reuse           on;

        proxy_set_header Host              bot.example.com;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  "";
        proxy_set_header X-Accel-Redirect  "";
        proxy_set_header Connection        "";

        proxy_connect_timeout              10s;
        proxy_send_timeout                 30s;
        proxy_read_timeout                 30s;

        proxy_hide_header X-Powered-By;
        proxy_hide_header X-AspNet-Version;
        proxy_hide_header X-Runtime;
        proxy_hide_header X-Generator;
        proxy_hide_header X-Accel-Redirect;
        proxy_hide_header Server;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options   "nosniff" always;
        add_header X-Frame-Options          "DENY" always;
        add_header Referrer-Policy          "no-referrer" always;
        add_header X-Robots-Tag             "noindex, nofollow" always;
        add_header Content-Security-Policy  "default-src 'none'; style-src 'unsafe-inline'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    }

    location /dl/ {
        limit_except GET HEAD { deny all; }

        limit_req zone=one burst=5 nodelay;

        proxy_pass                        https://bot.example.com:7443;
        proxy_http_version                1.1;

        proxy_ssl_protocols               TLSv1.2 TLSv1.3;
        proxy_ssl_server_name             on;
        proxy_ssl_name                    bot.example.com;
        proxy_ssl_verify                  on;
        proxy_ssl_trusted_certificate     /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_session_reuse           on;

        proxy_set_header Host              bot.example.com;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  "";
        proxy_set_header X-Accel-Redirect  "";
        proxy_set_header Connection        "";

        proxy_buffering                    off;
        proxy_request_buffering            off;

        proxy_connect_timeout              10s;
        proxy_send_timeout                 300s;
        proxy_read_timeout                 300s;

        proxy_hide_header X-Powered-By;
        proxy_hide_header X-AspNet-Version;
        proxy_hide_header X-Runtime;
        proxy_hide_header X-Generator;
        proxy_hide_header X-Accel-Redirect;
        proxy_hide_header Server;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options   "nosniff" always;
        add_header X-Frame-Options          "DENY" always;
        add_header Referrer-Policy          "no-referrer" always;
        add_header X-Robots-Tag             "noindex, nofollow" always;
    }

    location / {
        return 444;
    }
}
